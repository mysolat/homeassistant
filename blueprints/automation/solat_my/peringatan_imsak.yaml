blueprint:
  name: Peringatan Imsak (solat.my)
  description: Play a reminder audio and send a notification at Imsak time.
  domain: automation
  source_url: https://github.com/solatmy/homeassistant/blob/main/blueprints/automation/solat_my/peringatan_imsak.yaml
  input:
    imsak_sensor:
      name: Sensor Imsak
      default: sensor.waktu_solat_imsak
      selector:
        entity:
          domain: sensor
    media_player_select:
      name: Pemain Media
      default: select.waktu_solat_pemain_media_azan
      selector:
        entity:
          domain: select
    notify_service:
      name: Mobile Notify Service
      default: notify.notify
      selector:
        text:
    reminder_volume:
      name: Kelantangan Peringatan
      default: 0.5
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    imsak_filename:
      name: Fail Audio Imsak
      description: Filename in /media/azan/ for the Imsak reminder
      default: imsak_reminder.mp3
      selector:
        text:

mode: single

triggers:
  - trigger: time
    at: !input imsak_sensor

variables:
  media_player_select: !input media_player_select
  reminder_volume: !input reminder_volume
  imsak_filename: !input imsak_filename

actions:
  - action: persistent_notification.create
    data:
      notification_id: solat_imsak
      title: "🌙 Waktu Imsak"
      message: >
        {{ now().strftime('%-I:%M %p') }} — Sudah masuk waktu Imsak.
        Berhenti makan dan minum sekarang.

  - action: !input notify_service
    data:
      title: "🌙 Waktu Imsak"
      message: "Sudah masuk waktu Imsak. Berhenti makan dan minum sekarang."

  - if:
      - condition: template
        value_template: >
          {{ state_attr(states(media_player_select), 'supported_features') | int(0) | bitwise_and(4) > 0 }}
    then:
      - action: media_player.volume_set
        target:
          entity_id: "{{ states(media_player_select) }}"
        data:
          volume_level: "{{ reminder_volume }}"

  - action: media_player.play_media
    target:
      entity_id: "{{ states(media_player_select) }}"
    data:
      media:
        media_content_id: "media-source://media_source/local/azan/{{ imsak_filename }}"
        media_content_type: audio/mp3
        metadata: {}
