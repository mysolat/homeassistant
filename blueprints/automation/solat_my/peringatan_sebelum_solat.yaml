blueprint:
  name: Peringatan Sebelum Solat (solat.my)
  description: >
    Show a notification, and run your own actions such as a push, a set time
    before a chosen prayer time. Useful for Maghrib countdown during Ramadan.
  domain: automation
  source_url: https://github.com/mysolat/homeassistant/blob/main/blueprints/automation/solat_my/peringatan_sebelum_solat.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    prayer_sensor:
      name: Sensor Waktu Solat
      description: Prayer time sensor to count down to
      default: sensor.waktu_solat_maghrib
      selector:
        entity:
          domain: sensor
    time_before:
      name: Masa Sebelum
      description: >
        How long before the prayer to notify, as a negative duration.
        Enter -15 minutes for a reminder 15 minutes before.
      default:
        hours: 0
        minutes: -15
        seconds: 0
      selector:
        duration:
          allow_negative: true
    prayer_name:
      name: Nama Solat
      description: Label used inside the notification message
      default: Maghrib
      selector:
        text:
    notify_actions:
      name: Notifikasi tambahan
      description: >
        Optional actions to run at the reminder, for example a mobile push.
        Templates can use `prayer_name` and `minutes_before`.
      default: []
      selector:
        action: {}

mode: single

variables:
  prayer_sensor: !input prayer_sensor
  prayer_name: !input prayer_name
  minutes_before: "{{ ((as_timestamp(states(prayer_sensor)) - as_timestamp(trigger.now)) / 60) | round(0) | int }}"

triggers:
  - trigger: time
    at:
      entity_id: !input prayer_sensor
      offset: !input time_before

actions:
  - action: persistent_notification.create
    data:
      notification_id: solat_peringatan
      title: "🕌 Peringatan Waktu Solat"
      message: >
        {{ prayer_name }} dalam masa {{ minutes_before }} minit pada pukul
        {{ as_timestamp(states(prayer_sensor)) | timestamp_custom('%H:%M') }}.

  - choose: []
    alias: "Notifikasi tambahan"
    default: !input notify_actions
