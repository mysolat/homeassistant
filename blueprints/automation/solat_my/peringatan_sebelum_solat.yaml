blueprint:
  name: Peringatan Sebelum Solat (solat.my)
  description: >
    Send a push notification N minutes before a chosen prayer time. Useful for
    Maghrib countdown during Ramadan.
  domain: automation
  source_url: https://github.com/solatmy/homeassistant/blob/main/blueprints/automation/solat_my/peringatan_sebelum_solat.yaml
  input:
    prayer_sensor:
      name: Sensor Waktu Solat
      description: Prayer time sensor to count down to
      default: sensor.waktu_solat_maghrib
      selector:
        entity:
          domain: sensor
    minutes_before:
      name: Minit Sebelum
      description: How many minutes before the prayer to notify
      default: 15
      selector:
        number:
          min: 1
          max: 60
          step: 1
          unit_of_measurement: minutes
          mode: slider
    prayer_name:
      name: Nama Solat
      description: Label used inside the notification message
      default: Maghrib
      selector:
        text:
    notify_service:
      name: Mobile Notify Service
      default: notify.notify
      selector:
        text:

mode: single

variables:
  prayer_sensor: !input prayer_sensor
  minutes_before: !input minutes_before
  prayer_name: !input prayer_name

triggers:
  - trigger: template
    value_template: >
      {{ (as_timestamp(states(prayer_sensor)) - as_timestamp(now())) | int == (minutes_before | int * 60) }}

actions:
  - action: !input notify_service
    data:
      title: "🕌 Peringatan Waktu Solat"
      message: >
        {{ prayer_name }} dalam masa {{ minutes_before }} minit pada pukul
        {{ as_timestamp(states(prayer_sensor)) | timestamp_custom('%H:%M') }}.
      data:
        push:
          sound: default
