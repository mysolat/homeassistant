blueprint:
  name: Azan Harian (solat.my)
  description: >
    Play azan for all five prayer times using the `solat_my` integration.
    Plays a different azan for Subuh, optionally announces via TTS or
    pre-recorded audio before the azan, then plays doa selepas azan.
  domain: automation
  source_url: https://github.com/mysolat/homeassistant/blob/main/blueprints/automation/solat_my/azan_harian.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    subuh_sensor:
      name: Sensor Subuh
      description: Prayer time sensor for Subuh
      default: sensor.waktu_solat_subuh
      selector:
        entity:
          domain: sensor
    zohor_sensor:
      name: Sensor Zohor
      default: sensor.waktu_solat_zohor
      selector:
        entity:
          domain: sensor
    asar_sensor:
      name: Sensor Asar
      default: sensor.waktu_solat_asar
      selector:
        entity:
          domain: sensor
    maghrib_sensor:
      name: Sensor Maghrib
      default: sensor.waktu_solat_maghrib
      selector:
        entity:
          domain: sensor
    isyak_sensor:
      name: Sensor Isyak
      default: sensor.waktu_solat_isyak
      selector:
        entity:
          domain: sensor
    media_player_select:
      name: Pemain Media Azan
      description: Select entity that points to the media player playing the azan
      default: select.waktu_solat_pemain_media_azan
      selector:
        entity:
          domain: select
    volume_number:
      name: Kelantangan Azan
      description: Number entity controlling azan volume (0.0 - 1.0)
      default: number.waktu_solat_kelantangan_azan
      selector:
        entity:
          domain: number
    announcement_mode_select:
      name: Mod Pengumuman
      description: Select entity choosing announcement mode (tts or audio)
      default: select.waktu_solat_mod_pengumuman_azan
      selector:
        entity:
          domain: select
    azan_file_text:
      name: Fail Audio Azan
      description: Text entity with comma-separated azan filenames
      default: text.waktu_solat_fail_audio_azan
      selector:
        entity:
          domain: text
    azan_subuh_file_text:
      name: Fail Audio Azan Subuh
      default: text.waktu_solat_fail_audio_azan_subuh
      selector:
        entity:
          domain: text
    doa_file_text:
      name: Fail Doa Selepas Azan
      default: text.waktu_solat_fail_doa_selepas_azan
      selector:
        entity:
          domain: text
    tts_entity:
      name: TTS
      description: >
        TTS entity that announces the prayer in `tts` mode. Leave empty to
        skip the announcement.
      default: ""
      selector:
        entity:
          domain: tts
    skip_zohor_friday:
      name: Langkau Zohor pada Jumaat
      description: >
        Turn on when `azan_jumaat` plays the azan on Friday, so Zohor does
        not play twice.
      default: false
      selector:
        boolean:
    notify_actions:
      name: Notifikasi tambahan
      description: >
        Optional actions to run after the azan starts, for example a mobile
        push. `trigger.id` holds the prayer: subuh, zohor, asar, maghrib or
        isyak.
      default: []
      selector:
        action: {}
    subuh_delay:
      name: Tempoh Azan Subuh
      description: Delay after Subuh azan starts before playing doa
      default: "00:04:30"
      selector:
        duration:
    azan_delay:
      name: Tempoh Azan Lain
      description: Delay after non-Subuh azan starts before playing doa
      default: "00:02:47"
      selector:
        duration:

mode: single

triggers:
  - trigger: time
    at: !input subuh_sensor
    id: subuh
  - trigger: time
    at: !input zohor_sensor
    id: zohor
  - trigger: time
    at: !input asar_sensor
    id: asar
  - trigger: time
    at: !input maghrib_sensor
    id: maghrib
  - trigger: time
    at: !input isyak_sensor
    id: isyak

variables:
  media_player_select: !input media_player_select
  volume_number: !input volume_number
  announcement_mode_select: !input announcement_mode_select
  azan_file_text: !input azan_file_text
  azan_subuh_file_text: !input azan_subuh_file_text
  doa_file_text: !input doa_file_text
  tts_entity: !input tts_entity
  skip_zohor_friday: !input skip_zohor_friday

actions:
  - condition: template
    alias: "Langkau Zohor pada Jumaat"
    value_template: "{{ not (skip_zohor_friday and trigger.id == 'zohor' and now().weekday() == 4) }}"

  - action: persistent_notification.create
    data:
      notification_id: solat_azan
      title: >
        🕋 Waktu Solat —
        {% set names = {'subuh': 'Subuh', 'zohor': 'Zohor', 'asar': 'Asar', 'maghrib': 'Maghrib', 'isyak': 'Isyak'} %}
        {{ names[trigger.id] }}
      message: >
        {% set names = {'subuh': 'Subuh', 'zohor': 'Zohor', 'asar': 'Asar', 'maghrib': 'Maghrib', 'isyak': 'Isyak'} %}
        {{ now().strftime('%-I:%M %p') }} — Sekarang telah masuk waktu
        {{ names[trigger.id] }} bagi kawasan ini dan kawasan yang sama waktu dengannya.

  - if:
      - condition: template
        value_template: >
          {{ state_attr(states(media_player_select), 'supported_features') | int(0) | bitwise_and(4) > 0 }}
    then:
      - action: media_player.volume_set
        target:
          entity_id: "{{ states(media_player_select) }}"
        data:
          volume_level: "{{ states(volume_number) | float }}"

  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states(announcement_mode_select) == 'audio' }}"
        sequence:
          - action: media_player.play_media
            target:
              entity_id: "{{ states(media_player_select) }}"
            data:
              media:
                media_content_type: audio/mp3
                media_content_id: "media-source://media_source/local/tts/tts_{{ trigger.id }}.mp3"
                metadata: {}
          - delay: "00:00:10"
    default:
      - if:
          - condition: template
            value_template: "{{ tts_entity != '' }}"
        then:
          - action: tts.speak
            continue_on_error: true
            target:
              entity_id: "{{ tts_entity }}"
            data:
              media_player_entity_id: "{{ states(media_player_select) }}"
              message: >
                {% set names = {'subuh': 'Subuh', 'zohor': 'Zohor', 'asar': 'Asar', 'maghrib': 'Maghrib', 'isyak': 'Isyak'} %}
                Sekarang telah masuk waktu {{ names[trigger.id] }}.
          - delay: "00:00:10"

  - action: media_player.play_media
    target:
      entity_id: "{{ states(media_player_select) }}"
    data:
      extra:
        title: >
          {% set names = {'subuh': 'Subuh', 'zohor': 'Zohor', 'asar': 'Asar', 'maghrib': 'Maghrib', 'isyak': 'Isyak'} %}
          Azan {{ names[trigger.id] }}
        thumb: "https://solat.my/icon-512.png"
      media:
        media_content_type: audio/mp3
        media_content_id: >
          {% if trigger.id == 'subuh' %}
            {{ "media-source://media_source/local/azan/" ~ states(azan_subuh_file_text).split(',') | map('trim') | reject('eq', '') | list | random }}
          {% else %}
            {{ "media-source://media_source/local/azan/" ~ states(azan_file_text).split(',') | map('trim') | reject('eq', '') | list | random }}
          {% endif %}
        metadata: {}

  - choose: []
    alias: "Notifikasi tambahan"
    default: !input notify_actions

  - choose:
      - conditions:
          - condition: trigger
            id: subuh
        sequence:
          - delay: !input subuh_delay
    default:
      - delay: !input azan_delay

  - action: media_player.play_media
    alias: "Doa Selepas Azan"
    target:
      entity_id: "{{ states(media_player_select) }}"
    data:
      media:
        media_content_id: media-source://media_source/local/azan/{{ states(doa_file_text) }}
        media_content_type: audio/mpeg
        metadata:
          title: Doa Selepas Azan
          media_class: music
